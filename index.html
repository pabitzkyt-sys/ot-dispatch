<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OT Dispatch</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#111111">

</head>

<body>

<div id="app">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="topBar">

        <h1 id="appTitle"
            onclick="editTitle()">
            OT Dispatch
        </h1>

        <button
            id="settingsButton"
            class="iconButton"
            onclick="showScreen('settings')">

            ⚙️

        </button>

    </header>



    <!-- ========================= -->
    <!-- MAIN SCREEN -->
    <!-- ========================= -->

    <main
        id="dispatchScreen"
        class="screen activeScreen">




        <!-- ========================= -->
        <!-- MECHANICS -->
        <!-- ========================= -->

        <section class="card">

            <div class="cardHeader">

                <div class="cardTitle">

                    👷 Mechanics

                </div>

            </div>

            <div
                id="mechanicName"
                class="personName">

                Loading...

            </div>


            <div class="buttonRow">

                <div class="buttonGroup">

                    <button
                        class="dispatchButton decline"
                        onclick="vote('mechanic','decline')">

                        ❌

                    </button>

                    <div
                        id="mechDeclineCount"
                        class="buttonCount">

                        0

                    </div>

                </div>


                <div class="buttonGroup">

                    <button
                        class="dispatchButton unavailable"
                        onclick="vote('mechanic','na')">

                        ❓

                    </button>

                    <div
                        id="mechNACount"
                        class="buttonCount">

                        0

                    </div>

                </div>


                <div class="buttonGroup">

                    <button
                        class="dispatchButton accept"
                        onclick="vote('mechanic','accept')">

                        ✅

                    </button>

                    <div
                        id="mechAcceptCount"
                        class="buttonCount">

                        0

                    </div>

                </div>

            </div>

        </section>






        <!-- ========================= -->
        <!-- HELPERS -->
        <!-- ========================= -->

        <section class="card">

            <div class="cardHeader">

                <div class="cardTitle">

                    🧰 Helpers

                </div>

            </div>

            <div
                id="helperName"
                class="personName">

                Loading...

            </div>


            <div class="buttonRow">

                <div class="buttonGroup">

                    <button
                        class="dispatchButton decline"
                        onclick="vote('helper','decline')">

                        ❌

                    </button>

                    <div
                        id="helpDeclineCount"
                        class="buttonCount">

                        0

                    </div>

                </div>


                <div class="buttonGroup">

                    <button
                        class="dispatchButton unavailable"
                        onclick="vote('helper','na')">

                        ❓

                    </button>

                    <div
                        id="helpNACount"
                        class="buttonCount">

                        0

                    </div>

                </div>


                <div class="buttonGroup">

                    <button
                        class="dispatchButton accept"
                        onclick="vote('helper','accept')">

                        ✅

                    </button>

                    <div
                        id="helpAcceptCount"
                        class="buttonCount">

                        0

                    </div>

                </div>

            </div>

        </section>
                <!-- ========================= -->
        <!-- SETTINGS SCREEN -->
        <!-- ========================= -->

    </main>

    <section
        id="settingsScreen"
        class="screen">

        <header class="subHeader">

            <button
                class="backButton"
                onclick="showScreen('dispatch')">

                ←

            </button>

            <h2>Settings</h2>

        </header>


        <div class="settingsSection">

            <h3>Application</h3>

            <button
                class="menuButton"
                onclick="editTitle()">

                ✏️ Rename Title

            </button>

        </div>



        <div class="settingsSection">

            <h3>Mechanics</h3>

            <button
                class="menuButton"
                onclick="openRoster('mechanic')">

                👷 Edit Mechanics

            </button>

        </div>



        <div class="settingsSection">

            <h3>Helpers</h3>

            <button
                class="menuButton"
                onclick="openRoster('helper')">

                🧰 Edit Helpers

            </button>

        </div>



        <div class="settingsSection">

            <h3>History</h3>

            <button
                class="menuButton"
                onclick="showHistoryScreen()">

                📋 View History

            </button>

            <button
                class="menuButton danger"
                onclick="clearHistory()">

                🧹 Clear History

            </button>

        </div>

    </section>



    <!-- ========================= -->
    <!-- HISTORY SCREEN -->
    <!-- ========================= -->

    <section
        id="historyScreen"
        class="screen">

        <header class="subHeader">

            <button
                class="backButton"
                onclick="showScreen('settings')">

                ←

            </button>

            <h2>History</h2>

        </header>

        <div id="historyList">

        </div>

    </section>



    <!-- ========================= -->
    <!-- PERSON HISTORY -->
    <!-- ========================= -->

    <section
        id="personHistoryScreen"
        class="screen">

        <header class="subHeader">

            <button
                class="backButton"
                onclick="showHistoryScreen()">

                ←

            </button>

            <h2 id="historyPersonName">

                Person

            </h2>

        </header>

        <div
            id="personHistoryList">

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
