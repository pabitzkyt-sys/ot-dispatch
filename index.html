<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OT Dispatch</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <div class="header">
      <div class="title">OT DISPATCH</div>
      <div class="gear" onclick="openMenu()">⚙️</div>
    </div>

    <!-- MECHANICS -->
    <div class="section">

      <div class="label">MECHANICS</div>

      <div id="mechanicName" class="name">Loading...</div>

      <div class="buttons">

        <div class="btnWrap">
          <button class="red" onclick="vote('mechanic','decline')">❌</button>
          <div id="mechDecline" class="count">0</div>
        </div>

        <div class="btnWrap">
          <button class="yellow" onclick="vote('mechanic','na')">❓</button>
          <div id="mechNA" class="count">0</div>
        </div>

        <div class="btnWrap">
          <button class="green" onclick="vote('mechanic','accept')">✅</button>
          <div id="mechAccept" class="count">0</div>
        </div>

      </div>

    </div>

    <div class="divider"></div>

    <!-- HELPERS -->
    <div class="section">

      <div class="label">HELPERS</div>

      <div id="helperName" class="name">Loading...</div>

      <div class="buttons">

        <div class="btnWrap">
          <button class="red" onclick="vote('helper','decline')">❌</button>
          <div id="helpDecline" class="count">0</div>
        </div>

        <div class="btnWrap">
          <button class="yellow" onclick="vote('helper','na')">❓</button>
          <div id="helpNA" class="count">0</div>
        </div>

        <div class="btnWrap">
          <button class="green" onclick="vote('helper','accept')">✅</button>
          <div id="helpAccept" class="count">0</div>
        </div>

      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
