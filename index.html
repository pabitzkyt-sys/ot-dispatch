<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OT Dispatch</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div class="topBar">
    <h1 id="appTitle" onclick="editTitle()">OT Dispatch</h1>
    <button class="iconButton" onclick="showScreen('settings')">⚙️</button>
  </div>

  <!-- MAIN SCREEN -->
  <div id="dispatchScreen" class="screen activeScreen">

    <!-- MECHANICS -->
    <div class="card">
      <div class="cardTitle">👷 Mechanics</div>

      <div id="mechanicName" class="personName">Loading...</div>

      <div class="buttonRow">

        <div class="buttonGroup">
          <button class="dispatchButton decline" onclick="vote('mechanic','decline')">❌</button>
          <div id="mechDeclineCount" class="buttonCount">0</div>
        </div>

        <div class="buttonGroup">
          <button class="dispatchButton unavailable" onclick="vote('mechanic','na')">❓</button>
          <div id="mechNACount" class="buttonCount">0</div>
        </div>

        <div class="buttonGroup">
          <button class="dispatchButton accept" onclick="vote('mechanic','accept')">✅</button>
          <div id="mechAcceptCount" class="buttonCount">0</div>
        </div>

      </div>
    </div>

    <!-- HELPERS -->
    <div class="card">
      <div class="cardTitle">🧰 Helpers</div>

      <div id="helperName" class="personName">Loading...</div>

      <div class="buttonRow">

        <div class="buttonGroup">
          <button class="dispatchButton decline" onclick="vote('helper','decline')">❌</button>
          <div id="helpDeclineCount" class="buttonCount">0</div>
        </div>

        <div class="buttonGroup">
          <button class="dispatchButton unavailable" onclick="vote('helper','na')">❓</button>
          <div id="helpNACount" class="buttonCount">0</div>
        </div>

        <div class="buttonGroup">
          <button class="dispatchButton accept" onclick="vote('helper','accept')">✅</button>
          <div id="helpAcceptCount" class="buttonCount">0</div>
        </div>

      </div>
    </div>

  </div>

  <!-- SETTINGS -->
  <div id="settingsScreen" class="screen">

    <div class="subHeader">
      <button class="backButton" onclick="showScreen('dispatch')">←</button>
      <h2>Settings</h2>
    </div>

    <div class="settingsSection">
      <h3>Mechanics</h3>
      <div id="mechanicRoster"></div>
    </div>

    <div class="settingsSection">
      <h3>Helpers</h3>
      <div id="helperRoster"></div>
    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
